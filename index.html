<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pozos, Depósitos y Rebombeos · Agua Potable Lagos de Moreno</title>
<script src="jspdf.umd.min.js"></script>
<script src="datos.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3A3A3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pozos LM">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --orange:#FF8202;
    --orange-dark:#D96B00;
    --gray:#5F5F5F;
    --gray-dark:#3A3A3A;
    --cream:#FAF7F2;
    --line:#E6E1D8;
    --blue:#2E77D0;
    --green:#2E9E5B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background:var(--cream);
    color:var(--gray-dark);
    min-height:100vh;
  }
  header{
    background:var(--gray-dark);
    color:#fff;
    padding:16px 16px 12px;
    position:sticky; top:0; z-index:10;
  }
  .brand{
    text-align:center;
    line-height:1.25;
    margin-bottom:10px;
  }
  .brand .l1{color:var(--orange); font-weight:800; font-size:17px; letter-spacing:.02em;}
  .brand .l2{color:#bdbdbd; font-size:10.5px; letter-spacing:.03em;}
  .brand .l3{color:var(--orange); font-weight:800; font-size:13px; letter-spacing:.02em;}
  header h1{
    margin:0;
    font-size:16.5px;
    font-weight:700;
    text-align:center;
  }
  header .sub{
    font-size:11px;
    color:#bdbdbd;
    margin-top:2px;
    text-align:center;
  }
  #search{
    width:100%;
    margin-top:12px;
    padding:10px 12px;
    border-radius:10px;
    border:none;
    font-size:15px;
    background:#fff;
    color:var(--gray-dark);
  }
  .tabs{
    display:flex;
    gap:6px;
    margin-top:10px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:8px 4px;
    border-radius:8px;
    font-size:12.5px;
    font-weight:700;
    background:#4a4a4a;
    color:#ddd;
    cursor:pointer;
    border:2px solid transparent;
  }
  .tab.active{background:#fff; color:var(--gray-dark);}
  .tab.active.tipo-pozo{border-color:var(--blue); color:var(--blue);}
  .tab.active.tipo-deposito{border-color:var(--green); color:var(--green);}
  .tab.active.tipo-rebombeo{border-color:var(--orange); color:var(--orange-dark);}
  .tab.active.tipo-todos{border-color:var(--gray-dark);}

  main{padding:14px 12px 40px;}

  /* LIST VIEW */
  .item-card{
    background:#fff;
    border:1px solid var(--line);
    border-left:5px solid var(--gray);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
  }
  .item-card.tipo-pozo{border-left-color:var(--blue);}
  .item-card.tipo-deposito{border-left-color:var(--green);}
  .item-card.tipo-rebombeo{border-left-color:var(--orange);}
  .item-card:active{background:#fdf1e2;}
  .item-card .name{font-weight:700; font-size:15px;}
  .item-card .loc{font-size:12.5px; color:var(--gray); margin-top:2px;}
  .item-card .badge{
    display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase;
    padding:2px 6px; border-radius:5px; margin-top:4px; color:#fff;
  }
  .badge.tipo-pozo{background:var(--blue);}
  .badge.tipo-deposito{background:var(--green);}
  .badge.tipo-rebombeo{background:var(--orange-dark);}
  .item-card .arrow{color:var(--orange); font-size:20px; font-weight:700;}
  .empty{
    text-align:center; color:var(--gray); padding:40px 10px; font-size:14px;
  }

  /* DETAIL VIEW */
  #detail{display:none;}
  .back-btn{
    background:none; border:none; color:var(--orange);
    font-size:15px; font-weight:700; padding:4px 0 8px;
    cursor:pointer;
  }
  .detail-title{
    background:var(--orange);
    color:#fff;
    padding:12px 14px;
    border-radius:10px 10px 0 0;
    font-weight:700;
    font-size:16px;
  }
  .actions{
    display:flex; gap:10px; margin:12px 0 16px;
  }
  .actions button{
    flex:1;
    padding:12px 8px;
    border-radius:10px;
    border:none;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  #btn-pdf{background:var(--gray-dark); color:#fff;}
  #btn-earth{background:var(--orange); color:#fff;}
  .section-title{
    background:var(--gray-dark);
    color:#fff;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.03em;
    padding:6px 10px;
    margin-top:14px;
    border-radius:6px 6px 0 0;
  }
  table.fields{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border:1px solid var(--line);
    border-top:none;
    border-radius:0 0 6px 6px;
    overflow:hidden;
  }
  table.fields td{
    padding:7px 10px;
    font-size:13px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  table.fields tr:last-child td{border-bottom:none;}
  table.fields td.label{
    font-weight:600;
    color:var(--gray);
    width:48%;
    background:#fbf6ee;
  }
  .na{color:#b3b3b3; font-style:italic;}
  .bitacora{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 6px 6px;padding:4px 10px;}
  .bit-item{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.35;}
  .bit-item:last-child{border-bottom:none;}
  .bit-fecha{display:inline-block;background:#fdf1e2;color:var(--orange-dark);font-weight:700;font-size:11.5px;padding:2px 7px;border-radius:5px;margin-bottom:3px;}
  .bit-more{display:block;width:100%;margin:6px 0 4px;padding:8px;border:1px solid var(--line);background:#fbf6ee;border-radius:8px;color:var(--orange-dark);font-weight:700;font-size:13px;cursor:pointer;}
  .item-card .notas{font-size:11px;color:var(--gray);margin-top:3px;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="l1">AGUA POTABLE</div>
    <div class="l2">H. AYUNTAMIENTO 2024 - 2027</div>
    <div class="l3">LAGOS DE MORENO</div>
  </div>
  <h1>Pozos, Depósitos y Rebombeos</h1>
  <div class="sub" id="header-sub"></div>
  <input id="search" type="text" placeholder="Buscar por nombre, localidad o zona…" oninput="renderList()">
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div id="list"></div>

  <div id="detail">
    <button class="back-btn" onclick="showList()">‹ Volver al listado</button>
    <div class="detail-title" id="detail-name"></div>
    <div id="detail-photo"></div>
    <div class="actions">
      <button id="btn-pdf" onclick="generarPDF()">📄 Generar PDF</button>
      <button id="btn-earth" onclick="abrirMapa()">📍 Ver ubicación en Maps</button>
    </div>
    <div id="detail-body"></div>
  </div>
</main>

<script>


// Unify into one list for browsing/filtering, keep raw record for detail rendering
const ALL_ITEMS = [
  ...POZOS.map(p => ({
    id: "pozo::" + p.nombre_hoja,
    tipo: "Pozo",
    nombre: p.nombre_fuente || p.nombre_hoja,
    subtitle: p.localidad || "Sin localidad registrada",
    lat: p.lat, lon: p.lon,
    raw: p
  })),
  ...DEPOSITOS_REBOMBEOS.map(d => ({
    id: "dr::" + d.nombre,
    tipo: d.tipo, // "Depósito" | "Rebombeo"
    nombre: d.nombre,
    subtitle: d.zona_abastece || "Zona sin especificar",
    lat: d.lat, lon: d.lon,
    raw: d
  }))
];

const TIPO_CLASS = { "Pozo":"tipo-pozo", "Depósito":"tipo-deposito", "Rebombeo":"tipo-rebombeo" };

let current = null;
let activeTab = "Todos";

const TABS = ["Todos","Pozo","Depósito","Rebombeo"];
const TAB_LABEL = { "Todos":"Todos", "Pozo":"Pozos", "Depósito":"Depósitos", "Rebombeo":"Rebombeos" };
const TAB_CLASS = { "Todos":"tipo-todos", "Pozo":"tipo-pozo", "Depósito":"tipo-deposito", "Rebombeo":"tipo-rebombeo" };

function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(t => `
    <div class="tab ${t===activeTab?'active '+TAB_CLASS[t]:''}" onclick="setTab('${t}')">${TAB_LABEL[t]}</div>
  `).join('');
}
function setTab(t){
  activeTab = t;
  renderTabs();
  renderList();
}

function nd(v){
  if(v === null || v === undefined || v === "") return '<span class="na">No especificado</span>';
  return v;
}
function ndPlain(v){
  if(v === null || v === undefined || v === "") return "No especificado";
  return String(v);
}

function renderList(){
  const q = document.getElementById('search').value.trim().toUpperCase();
  const list = document.getElementById('list');
  const filtered = ALL_ITEMS.filter(it =>
    (activeTab === "Todos" || it.tipo === activeTab) &&
    ((it.nombre||"").toUpperCase().includes(q) || (it.subtitle||"").toUpperCase().includes(q))
  );
  if(filtered.length === 0){
    list.innerHTML = '<div class="empty">No se encontraron resultados con ese criterio.</div>';
    return;
  }
  list.innerHTML = filtered.map(it => `
    <div class="item-card ${TIPO_CLASS[it.tipo]}" onclick="showDetail('${it.id.replace(/'/g,"\\'")}')">
      <div>
        <div class="name">${it.nombre}</div>
        <div class="loc">${it.subtitle}</div>
        <div class="badge ${TIPO_CLASS[it.tipo]}">${it.tipo}</div>
        ${(it.raw.bitacora && it.raw.bitacora.length) ? `<div class="notas">🛠 ${it.raw.bitacora.length} registros en bitácora · último: ${esc(it.raw.bitacora[it.raw.bitacora.length-1].fecha || 's/f')}</div>` : ''}
      </div>
      <div class="arrow">›</div>
    </div>
  `).join('');
}

const SECTIONS_POZO = [
  { title: "IDENTIFICACIÓN", fields: [
    ["Localidad/Fracc.","localidad"], ["Municipio","municipio"], ["Folio","folio"],
    ["Fecha reporte","fecha_reporte"], ["Ubicación GPS","gps_raw"],
    ["Coordenadas geográficas","coord_geo"], ["Coordenadas UTM","coord_utm"], ["Altitud","altitud"]
  ]},
  { title: "DATOS DE OPERACIÓN", fields: [
    ["Profundidad","profundidad"], ["Modelo de bomba","modelo_bomba"], ["HP bomba","hp_bomba"],
    ["Horario operación","horario_operacion"], ["Diámetro ademe","diametro_ademe"],
    ["KVA transformador","kva_transformador"], ["Válvula check","valvula_check"],
    ["Tipo/modelo arrancador","tipo_arrancador"], ["Voltaje","voltaje"],
    ["Días de operación","dias_operacion"], ["Diámetro tren de descarga","diam_tren_descarga"],
    ["Long. columna de succión","long_columna_succion"], ["Diám. columna de succión","diam_columna_succion"]
  ]},
  { title: "HIDRÁULICA", fields: [
    ["Nivel dinámico","nivel_dinamico"], ["Nivel estático","nivel_estatico"], ["Caudal L/s","caudal_ls"]
  ]},
  { title: "EQUIPAMIENTO E INSTRUMENTACIÓN", fields: [
    ["Macromedidor","macromedidor"], ["Macromedidor funciona","macromedidor_funciona"],
    ["Manómetro","manometro"], ["Manómetro funciona","manometro_funciona"],
    ["Válvula expulsora de aire","valvula_expulsora_aire"], ["Llave toma muestras","llave_toma_muestras"],
    ["Medidor CFE","medidor_cfe"], ["Inserción cloración","insercion_cloracion"],
    ["Estado inserción cloración","estado_insercion_cloracion"], ["¿Fugas en tren descarga?","fugas_tren_descarga"]
  ]},
  { title: "INFRAESTRUCTURA Y OBRA CIVIL", fields: [
    ["Poliducto","poliducto"], ["Estado poliducto","estado_poliducto"], ["Engrabador","engrabador"],
    ["Estado engrabador","estado_engrabador"], ["Fluido directo a red","fluido_directo_red"],
    ["Fluido llega a tanque","fluido_llega_tanque"], ["Nombre del tanque","nombre_tanque"],
    ["Zona que abastece","zona_abastece"], ["Tipo de descarga","tipo_descarga"], ["Cerco perimetral","cerco_perimetral"],
    ["Pintada e identificada","pintada_identificada"], ["Libre de objetos/limpio","libre_objetos"]
  ]},
  { title: "POBLACIÓN Y USO", fields: [
    ["Personas beneficiadas","personas_beneficiadas"], ["Uso del agua","uso_agua"],
    ["Año de construcción","anio_construccion"], ["Fecha última prueba de bombeo","fecha_prueba_bombeo"]
  ]},
  { title: "CALIDAD DEL AGUA Y PLANTA POTABILIZADORA", fields: [
    ["Fecha último análisis","fecha_analisis_calidad"], ["Llega planta potabilizadora","llega_planta_potabilizadora"],
    ["Opera planta potabilizadora","opera_planta_potabilizadora"], ["Nombre planta potabilizadora","nombre_planta_potabilizadora"]
  ]},
  { title: "CASETA DE CLORACIÓN Y DOSIFICACIÓN", fields: [
    ["Caseta de cloración","caseta_cloracion"], ["Estado de la caseta","estado_caseta"],
    ["Ductos de ventilación","ductos_ventilacion"], ["Corriente eléctrica","corriente_electrica"],
    ["Voltaje eléctrico","voltaje_electrico"], ["Sistema de dosificación","sistema_dosificacion"],
    ["Marca dosificador","marca_dosificador"], ["Modelo dosificador","modelo_dosificador"],
    ["Dosificador operando","dosificador_operando"], ["Contenedor prod. químico","contenedor_producto_quimico"],
    ["Hipoclorito de sodio","hipoclorito_sodio"], ["Cantidad hipoclorito","cantidad_hipoclorito"],
    ["Línea conducción cloro","linea_conduccion_cloro"], ["Estado línea de cloro","estado_linea_cloro"]
  ]},
  { title: "OTROS", fields: [
    ["Comentarios","comentarios"], ["Autoriza","autoriza"], ["Título de propiedad","titulo_propiedad"]
  ]}
];

const SECTIONS_DR = [
  { title: "INFORMACIÓN GENERAL", fields: [
    ["Tipo","tipo"], ["Estatus legal","estatus_legal"], ["Zona que abastece","zona_abastece"],
    ["Volumen de almacenamiento","volumen"], ["Ubicación GPS","gps_raw"]
  ]}
];

function sectionsFor(item){
  return item.tipo === "Pozo" ? SECTIONS_POZO : SECTIONS_DR;
}

function showDetail(id){
  current = ALL_ITEMS.find(it => it.id === id);
  if(!current) return;
  document.getElementById('detail-name').textContent = current.nombre;
  const photoEl = document.getElementById('detail-photo');
  photoEl.innerHTML = current.raw.foto
    ? `<img src="${current.raw.foto}" alt="${current.nombre}" style="width:100%; max-width:420px; max-height:320px; object-fit:cover; border-radius:10px; margin:10px auto; display:block;">`
    : '';

  let html = "";
  sectionsFor(current).forEach(sec => {
    html += `<div class="section-title">${sec.title}</div><table class="fields">`;
    sec.fields.forEach(([label,key]) => {
      html += `<tr><td class="label">${label}</td><td>${nd(current.raw[key])}</td></tr>`;
    });
    html += `</table>`;
  });
  const bit = current.raw.bitacora || [];
  if(current.tipo === "Pozo"){
    html += `<div class="section-title">BITÁCORA DE EVENTOS (${bit.length})</div><div class="bitacora">`;
    if(bit.length === 0){
      html += `<div class="bit-item"><span class="na">Sin registros</span></div>`;
    } else {
      const rev = bit.slice().reverse();
      rev.forEach((e,i) => {
        html += `<div class="bit-item${i>=10?' bit-extra':''}" ${i>=10?'style="display:none"':''}><span class="bit-fecha">${esc(e.fecha || 'Sin fecha')}</span><div>${esc(e.texto)}</div></div>`;
      });
      if(rev.length > 10) html += `<button class="bit-more" onclick="verTodaBitacora(this)">Ver los ${rev.length} registros</button>`;
    }
    html += `</div>`;
  }
  document.getElementById('detail-body').innerHTML = html;

  document.getElementById('list').style.display = 'none';
  document.querySelector('header').style.display = 'none';
  document.getElementById('detail').style.display = 'block';
}

function esc(t){
  return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function verTodaBitacora(btn){
  document.querySelectorAll('.bit-extra').forEach(el => el.style.display = 'block');
  btn.remove();
}

function showList(){
  document.getElementById('detail').style.display = 'none';
  document.getElementById('list').style.display = 'block';
  document.querySelector('header').style.display = 'block';
  current = null;
}

function abrirMapa(){
  if(!current || current.lat === null || current.lon === null){
    alert("Este elemento no tiene coordenadas GPS registradas.");
    return;
  }
  const url = `https://www.google.com/maps?q=${current.lat},${current.lon}`;
  window.open(url, "_blank");
}

function fotoADataURL(src){
  return new Promise((resolve) => {
    if(src.startsWith('data:')) return resolve(src);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      try { resolve(c.toDataURL('image/jpeg', 0.85)); } catch(e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function loadImageDims(dataUri){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => resolve(null);
    img.src = dataUri;
  });
}

async function generarPDF(){
  if(!current) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"letter"});
  const orange = [255,130,2];
  const gray = [58,58,58];
  const lightRow = [253,241,216];
  let y = 18;

  doc.setFillColor(...orange);
  doc.rect(0,0,216,14,'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(11);
  doc.setFont(undefined,'bold');
  doc.text("AGUA POTABLE  ·  H. AYUNTAMIENTO 2024-2027  ·  LAGOS DE MORENO", 10, 9);

  doc.setTextColor(...gray);
  doc.setFontSize(15);
  doc.text(current.nombre, 10, y);
  y += 6;

  const fotoPDF = current.raw.foto ? await fotoADataURL(current.raw.foto) : null;
  if(fotoPDF){
    const dims = await loadImageDims(fotoPDF);
    if(dims){
      const maxWidth = 100; // mm
      const maxHeight = 70; // mm
      let w = maxWidth;
      let h = (dims.h / dims.w) * w;
      if(h > maxHeight){
        h = maxHeight;
        w = (dims.w / dims.h) * h;
      }
      const x = (216 - w) / 2;
      doc.addImage(fotoPDF, "JPEG", x, y, w, h);
      y += h + 6;
    }
  } else {
    y += 2;
  }

  sectionsFor(current).forEach(sec => {
    if(y > 265){ doc.addPage(); y = 15; }
    doc.setFillColor(...gray);
    doc.setTextColor(255,255,255);
    doc.setFontSize(9.5);
    doc.rect(10, y, 196, 6, 'F');
    doc.text(sec.title, 12, y+4.2);
    y += 6;

    sec.fields.forEach(([label,key], i) => {
      if(y > 275){ doc.addPage(); y = 15; }
      const val = ndPlain(current.raw[key]);
      if(i % 2 === 0){
        doc.setFillColor(...lightRow);
        doc.rect(10, y, 196, 6, 'F');
      }
      doc.setTextColor(...gray);
      doc.setFontSize(8.5);
      doc.setFont(undefined,'bold');
      doc.text(label, 12, y+4.2);
      doc.setFont(undefined,'normal');
      doc.text(String(val), 95, y+4.2, {maxWidth:108});
      y += 6;
    });
    y += 2;
  });

  const bit = current.raw.bitacora || [];
  if(current.tipo === "Pozo" && bit.length){
    if(y > 255){ doc.addPage(); y = 15; }
    doc.setFillColor(...gray);
    doc.setTextColor(255,255,255);
    doc.setFontSize(9.5);
    doc.setFont(undefined,'bold');
    doc.rect(10, y, 196, 6, 'F');
    doc.text(`BITÁCORA DE EVENTOS (${bit.length})`, 12, y+4.2);
    y += 8;
    bit.slice().reverse().forEach((e, i) => {
      doc.setFontSize(8.5);
      const lines = doc.splitTextToSize(String(e.texto), 150);
      const h = Math.max(1, lines.length) * 3.8 + 2;
      if(y + h > 272){ doc.addPage(); y = 15; }
      if(i % 2 === 0){
        doc.setFillColor(...lightRow);
        doc.rect(10, y-1, 196, h, 'F');
      }
      doc.setTextColor(...gray);
      doc.setFont(undefined,'bold');
      doc.text(String(e.fecha || 'Sin fecha'), 12, y+2.8);
      doc.setFont(undefined,'normal');
      doc.text(lines, 50, y+2.8);
      y += h;
    });
  }

  const fileName = current.nombre.replace(/[^a-z0-9]+/gi,'_') + '.pdf';
  doc.save(fileName);
}

document.getElementById('header-sub').textContent =
  `Actualizado 20/11/2026 · ${POZOS.length} pozos · ${DEPOSITOS_REBOMBEOS.filter(d=>d.tipo==="Depósito").length} depósitos · ${DEPOSITOS_REBOMBEOS.filter(d=>d.tipo==="Rebombeo").length} rebombeos`;
renderTabs();
